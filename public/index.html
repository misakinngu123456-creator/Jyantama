<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>35000点スタート オンライン三人麻雀</title>
    <style>
        body { background-color: #1b5e20; color: white; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
        
        /* 入室フォーム */
        #join-screen { background: rgba(0,0,0,0.6); max-width: 400px; margin: 50px auto; padding: 30px; border-radius: 12px; }
        input { padding: 10px; font-size: 16px; margin: 10px 0; width: 80%; border-radius: 5px; border: none; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; background: #ff9800; border: none; color: white; border-radius: 5px; font-weight: bold; }
        button:hover { background: #f57c00; }

        /* ゲーム画面 */
        #game-screen { display: none; }
        .score-board { display: flex; justify-content: center; gap: 20px; margin: 20px; }
        .player-card { background: rgba(0,0,0,0.5); padding: 10px 20px; border-radius: 8px; min-width: 100px; }
        #board { width: 80%; height: 150px; background: #2e7d32; border: 2px solid #fff; margin: 0 auto; padding: 10px; overflow-y: auto; }
        #hand { display: flex; justify-content: center; gap: 5px; margin-top: 30px; }
        .tile { width: 45px; height: 65px; background: #fff; color: #000; font-weight: bold; border-radius: 5px; display: flex; align-items: center; justify-content: center; cursor: pointer; user-select: none; }
        .tile:hover { background: #ffe0b2; }
    </style>
</head>
<body>

    <!-- 1. 合言葉・名前の入力画面 -->
    <div id="join-screen">
        <h2>対戦部屋に入る</h2>
        <input type="text" id="room-id" placeholder="部屋の合言葉（例: mahjong123）"><br>
        <input type="text" id="player-name" placeholder="プレイヤー名"><br>
        <button onclick="joinRoom()">部屋に入る</button>
    </div>

    <!-- 2. 麻雀ゲーム画面 -->
    <div id="game-screen">
        <h2 id="room-title"></h2>
        <button onclick="startGame()">ゲームスタート（全員揃ったら押す）</button>

        <div class="score-board" id="scores"></div>

        <h3>河（捨て牌）</h3>
        <div id="board"></div>

        <h3>自分の手牌（クリックで打牌）</h3>
        <div id="hand"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let myRoomId = "";

        function joinRoom() {
            const roomId = document.getElementById('room-id').value.trim();
            const playerName = document.getElementById('player-name').value.trim();

            if (!roomId) {
                alert("合言葉を入力してください");
                return;
            }

            myRoomId = roomId;
            socket.emit('joinRoom', { roomId, playerName });

            // 画面の切り替え
            document.getElementById('join-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            document.getElementById('room-title').innerText = `部屋の合言葉: ${roomId}`;
        }

        function startGame() {
            socket.emit('startGame');
        }

        function discard(index) {
            socket.emit('discard', index);
        }

        // サーバーから状態が更新された通知を受け取る
        socket.on('updateState', (room) => {
            // スコアボード（メンバーと点数）の表示
            const scoresDiv = document.getElementById('scores');
            scoresDiv.innerHTML = '';
            room.players.forEach(p => {
                scoresDiv.innerHTML += `
                    <div class="player-card">
                        <div>${p.name} ${p.id === socket.id ? '(自分)' : ''}</div>
                        <div><strong>${p.score.toLocaleString()} 点</strong></div>
                    </div>
                `;
            });

            // 捨て牌の表示
            const boardDiv = document.getElementById('board');
            boardDiv.innerHTML = room.discards.map(d => `[${d.playerName}: ${d.tile}]`).join(' ');

            // 自分の手牌の表示
            const me = room.players.find(p => p.id === socket.id);
            const handDiv = document.getElementById('hand');
            handDiv.innerHTML = '';

            if (me && me.hand) {
                me.hand.forEach((tile, index) => {
                    const el = document.createElement('div');
                    el.className = 'tile';
                    el.innerText = tile;
                    el.onclick = () => discard(index);
                    handDiv.appendChild(el);
                });
            }
        });
    </script>
</body>
</html>
